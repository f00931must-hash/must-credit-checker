<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="明新科技大學資源教室學分檢核系統">
  <title>學分檢核系統｜明新科技大學資源教室</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">明新科技大學｜資源教室</p>
      <h1>學分檢核系統</h1>
    </div>
    <span class="demo-badge">第一版示範模式</span>
  </header>

  <main class="page-shell">
    <section id="homeView" class="view">
      <div class="hero card">
        <div>
          <p class="eyebrow">畢業學分，一眼看懂</p>
          <h2>查詢已完成與尚未完成的學分</h2>
          <p>系統只呈現學分與修課狀態，不顯示原始成績。</p>
        </div>
        <div class="role-grid">
          <button class="role-card" id="studentEntry">
            <span class="role-icon">學</span>
            <strong>學生查詢</strong>
            <small>使用姓名與學號</small>
          </button>
          <button class="role-card" id="teacherEntry">
            <span class="role-icon">師</span>
            <strong>老師／小幫手</strong>
            <small>進入管理與檢核</small>
          </button>
        </div>
      </div>
    </section>

    <section id="queryView" class="view hidden">
      <button class="back-button" data-back="homeView">← 返回首頁</button>
      <div class="narrow card">
        <p class="eyebrow">學生查詢</p>
        <h2>查看我的學分進度</h2>
        <form id="queryForm" class="form-stack">
          <label>姓名<input id="queryName" autocomplete="name" required placeholder="示範請輸入：王小明"></label>
          <label>學號<input id="queryStudentId" required placeholder="示範請輸入：B11500001"></label>
          <p id="queryError" class="form-error" role="alert"></p>
          <button class="primary" type="submit">查詢學分</button>
        </form>
        <p class="hint">示範資料：王小明／B11500001</p>
      </div>
    </section>

    <section id="teacherView" class="view hidden">
      <button class="back-button" data-back="homeView">← 返回首頁</button>
      <div class="section-heading">
        <div><p class="eyebrow">老師／小幫手後台</p><h2>我的學生</h2></div>
        <button class="primary" id="addStudentBtn">＋ 新增學生</button>
      </div>
      <div class="notice">示範模式尚未連接真實資料。正式版登入後，只會載入目前帳號負責的學生。</div>
      <div class="student-list" id="studentList"></div>
    </section>

    <section id="detailView" class="view hidden">
      <button class="back-button" id="detailBack">← 返回</button>
      <div id="studentHeader" class="student-header card"></div>
      <div id="creditSummary" class="credit-grid"></div>
      <div id="generalEducationSummary"></div>
      <div id="externalSummary"></div>

      <div class="toolbar card">
        <div class="tabs" id="detailTabs">
          <button class="tab active" data-tab="timeline">依年級查看</button>
          <button class="tab" data-tab="missing">只看尚未完成</button>
          <button class="tab teacher-only" data-tab="unmatched">待人工分類</button>
        </div>
        <label class="select-label">年級／學期
          <select id="termFilter">
            <option value="all">全部</option>
            <option value="1-1">一年級上學期</option><option value="1-2">一年級下學期</option>
            <option value="2-1">二年級上學期</option><option value="2-2">二年級下學期</option>
            <option value="3-1">三年級上學期</option><option value="3-2">三年級下學期</option>
            <option value="4-1">四年級上學期</option><option value="4-2">四年級下學期</option>
          </select>
        </label>
      </div>
      <div id="courseContent"></div>
      <p class="disclaimer">本系統提供修課規劃與初步檢核，實際畢業資格仍以教務處正式審核結果為準。</p>
    </section>
  </main>

  <dialog id="classifyDialog">
    <form method="dialog" id="classifyForm">
      <div class="dialog-heading"><h3>人工認列課程</h3><button value="cancel" aria-label="關閉">×</button></div>
      <p id="classifyCourseName"></p>
      <label>認列方式
        <select id="classificationType">
          <option value="category">只認列學分類別</option>
          <option value="replacement">替代時序表內特定課程</option>
          <option value="excluded">不列入畢業學分</option>
        </select>
      </label>
      <label>學分類別
        <select id="classificationCategory">
          <option>校必修</option><option>院必修</option><option>專業必修</option><option>專業選修</option>
        </select>
      </label>
      <label class="check-label"><input type="checkbox" id="classificationExternal"> 此課程為外系課程（最多認列12學分）</label>
      <label>備註<textarea id="classificationNote" placeholder="例如：系上確認可認列為專業選修"></textarea></label>
      <menu><button value="cancel">取消</button><button class="primary" value="default" id="saveClassification">儲存認列</button></menu>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
